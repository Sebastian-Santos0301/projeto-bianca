<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JOGO BIANCA - V2</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: 'Arial', sans-serif; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; background: #000; }
        canvas { display: block; max-width: 100%; max-height: 100%; }
        
        #ui-layer { position: absolute; top: 20px; left: 20px; color: white; z-index: 5; font-size: 20px; text-shadow: 2px 2px 0 #000; font-weight: bold;}
        
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white; z-index: 10;
        }
        button { 
            padding: 15px 50px; font-size: 24px; font-weight: bold; text-transform: uppercase;
            background: #e84118; color: white; border: none; border-radius: 5px; 
            margin-top: 20px; cursor: pointer; box-shadow: 0 4px 0 #c23616;
        }
        button:active { transform: translateY(4px); box-shadow: none; }
        
        .mobile-controls {
            position: absolute; bottom: 20px; width: 100%; display: flex; 
            justify-content: space-between; padding: 0 20px; box-sizing: border-box; 
            pointer-events: none; z-index: 20;
        }
        .btn-control {
            width: 90px; height: 90px; background: rgba(255,255,255,0.1); 
            border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); 
            pointer-events: auto; display: flex; justify-content: center; 
            align-items: center; font-size: 40px; color: white; user-select: none;
        }
        .btn-control:active { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1 style="font-size: 50px; margin-bottom: 0; font-style: italic;">TURBO BIANCA</h1>
        <p>Desvie do trânsito!</p>
        <button onclick="iniciarJogo()">LIGAR MOTOR</button>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            SCORE: <span id="score">0</span>
        </div>
        <div class="mobile-controls" id="mobileControls" style="display:none;">
            <div class="btn-control" id="btnLeft">◀</div>
            <div class="btn-control" id="btnRight">▶</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const socket = io();

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- CONFIGURAÇÕES DO JOGO ---
        let jogoRodando = false;
        let frameId;
        let velocidade = 0;
        let distancia = 0;
        // Ajuste de velocidade (Mais lento e suave)
        const VELOCIDADE_INICIAL = 2; 
        const ACELERACAO = 0.001; 
        const VELOCIDADE_MAX = 12;

        let jogador = { faixa: 1, x: 0, y: 0, cor: '#e84118', w: 60, h: 50 };
        let obstaculos = [];

        // --- ARTE: DESENHAR CARRO (Função Artística) ---
        function desenharSpriteCarro(ctx, x, y, scale, corPrincipal) {
            const w = 60 * scale; // Largura base
            const h = 50 * scale; // Altura base

            // 1. Pneus (Pretos nas laterais)
            ctx.fillStyle = '#111';
            ctx.fillRect(x - w*0.1, y + h*0.6, w*0.2, h*0.4); // Esq
            ctx.fillRect(x + w*0.9, y + h*0.6, w*0.2, h*0.4); // Dir

            // 2. Chassi (Corpo do carro)
            ctx.fillStyle = corPrincipal;
            // Parte inferior larga
            ctx.fillRect(x, y + h*0.4, w, h*0.6); 
            // Parte superior (Teto) mais estreita
            ctx.fillRect(x + w*0.15, y, w*0.7, h*0.4);

            // 3. Vidro Traseiro
            ctx.fillStyle = '#87ceeb'; // Azul claro reflexo
            ctx.fillRect(x + w*0.2, y + h*0.05, w*0.6, h*0.3);

            // 4. Lanternas Traseiras (Vermelhas)
            ctx.fillStyle = '#c0392b';
            ctx.fillRect(x + w*0.05, y + h*0.5, w*0.2, h*0.15); // Esq
            ctx.fillRect(x + w*0.75, y + h*0.5, w*0.2, h*0.15); // Dir
            
            // 5. Placa (Amarela)
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(x + w*0.35, y + h*0.6, w*0.3, h*0.15);
        }

        function desenharCenario() {
            // Céu Noturno
            ctx.fillStyle = '#192a56'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const h = canvas.height / 2;
            
            // Grama
            ctx.fillStyle = '#273c75'; 
            ctx.fillRect(0, h, canvas.width, h);

            // Estrada
            ctx.fillStyle = '#7f8fa6'; 
            ctx.beginPath();
            // AQUI: Aumentei o horizonte (width/2 - 80) para facilitar a visão
            ctx.moveTo(canvas.width/2 - 100, h); 
            ctx.lineTo(canvas.width/2 + 100, h);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();

            // Faixas Divisórias
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 20]); // Tracejado
            ctx.beginPath();
            
            // Faixa Esq
            ctx.moveTo(canvas.width/2 - 30, h);
            ctx.lineTo(canvas.width/3, canvas.height);
            
            // Faixa Dir
            ctx.moveTo(canvas.width/2 + 30, h);
            ctx.lineTo(canvas.width*2/3, canvas.height);
            
            ctx.stroke();
            ctx.setLineDash([]); // Limpa tracejado
        }

        function desenharJogador() {
            const centroTela = canvas.width / 2;
            const larguraBase = canvas.width; 
            // Cálculo de posição na pista
            let offset = (jogador.faixa - 1) * (larguraBase * 0.28);
            
            jogador.x = centroTela + offset - (jogador.w/2);
            jogador.y = canvas.height - 120; // Mais para cima para ver o chão

            // Desenha usando a função artística (Escala 1.5 para ficar visível)
            desenharSpriteCarro(ctx, jogador.x, jogador.y, 1.5, jogador.cor);
        }

        function gerenciarObstaculos() {
            // Gerar inimigos (Chance reduzida para não virar bagunça)
            if (Math.random() < 0.015) {
                const coresInimigas = ['#4cd137', '#0097e6', '#8c7ae6', '#e1b12c'];
                obstaculos.push({
                    faixa: Math.floor(Math.random() * 3),
                    y: canvas.height / 2, // Nasce no horizonte
                    scale: 0.1, // Começa pequenininho
                    cor: coresInimigas[Math.floor(Math.random() * coresInimigas.length)]
                });
            }

            for (let i = obstaculos.length - 1; i >= 0; i--) {
                let obs = obstaculos[i];
                
                // Movimento suave baseado na velocidade
                obs.y += (velocidade * 1.2) + (obs.scale * 5);
                obs.scale += 0.012; // Cresce conforme aproxima

                // Perspectiva
                const centroTela = canvas.width / 2;
                const progressoY = (obs.y - canvas.height/2) / (canvas.height/2);
                
                // Abertura da pista (ajustada para combinar com o horizonte maior)
                const spread = canvas.width * 0.9 * progressoY; 
                const offset = (obs.faixa - 1) * (spread / 2);
                
                // Calcula X centralizado no objeto
                // A escala base é 60px de largura.
                const larguraAtual = 60 * obs.scale * 4; 
                const x = centroTela + offset - (larguraAtual/2);

                if (obs.y > canvas.height/2) {
                    // Desenha inimigo usando a mesma arte, mas com escala dinâmica
                    desenharSpriteCarro(ctx, x, obs.y, obs.scale * 4, obs.cor);
                }

                // Colisão (Hitbox ajustada)
                // O jogador está fixo em Y = canvas.height - 120
                // Altura do jogador aprox 75px
                const jogadorY = canvas.height - 120;
                const jogadorH = 75;

                // Se o inimigo chegou na linha do jogador
                if (obs.y + (30*obs.scale) > jogadorY && obs.y < jogadorY + jogadorH) {
                    if (obs.faixa === jogador.faixa) {
                        gameOver();
                    }
                }

                if (obs.y > canvas.height) obstaculos.splice(i, 1);
            }
        }

        function loop() {
            if (!jogoRodando) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            desenharCenario();
            
            // Aceleração progressiva
            if (velocidade < VELOCIDADE_MAX) velocidade += ACELERACAO;
            
            distancia += Math.round(velocidade * 10); // Pontuação sobe mais rápido visualmente
            document.getElementById('score').innerText = distancia;
            
            if(distancia % 100 === 0) socket.emit('atualizarScore', distancia);

            gerenciarObstaculos();
            desenharJogador();
            frameId = requestAnimationFrame(loop);
        }

        function iniciarJogo() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('mobileControls').style.display = 'flex';
            jogoRodando = true;
            velocidade = VELOCIDADE_INICIAL; // Começa devagar
            distancia = 0;
            obstaculos = [];
            loop();
        }

        function gameOver() {
            jogoRodando = false;
            cancelAnimationFrame(frameId);
            alert('BATIDA! Pontuação: ' + distancia);
            location.reload();
        }

        // --- CONTROLES ---
        function mover(direcao) {
            if (!jogoRodando) return;
            let novaFaixa = jogador.faixa + direcao;
            if (novaFaixa >= 0 && novaFaixa <= 2) jogador.faixa = novaFaixa;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') mover(-1);
            if (e.key === 'ArrowRight' || e.key === 'd') mover(1);
        });

        // Touch otimizado (Impede zoom duplo toque)
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); mover(-1); });
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); mover(1); });

        socket.on('setupJogador', (dados) => { 
            // Mantém a cor vermelha padrão ou usa a do servidor se quiser
             // jogador.cor = dados.cor; 
        });
    </script>
</body>
</html>
