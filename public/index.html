<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TURBO BIANCA - V5</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: 'Arial', sans-serif; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; background: #000; }
        canvas { display: block; max-width: 100%; max-height: 100%; }
        
        #ui-layer { position: absolute; top: 20px; left: 20px; color: white; z-index: 5; font-size: 18px; text-shadow: 2px 2px 0 #000; font-weight: bold;}
        
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white; z-index: 10;
        }
        h1 { margin: 0 0 10px 0; font-size: 40px; font-style: italic; color: #ffeb3b; text-transform: uppercase; }
        button { 
            padding: 20px 60px; font-size: 24px; font-weight: bold; text-transform: uppercase;
            background: #e84118; color: white; border: none; border-radius: 5px; 
            margin-top: 30px; cursor: pointer; box-shadow: 0 5px 0 #c23616;
        }
        button:active { transform: translateY(4px); box-shadow: none; }
        
        .mobile-controls {
            position: absolute; bottom: 20px; width: 100%; display: flex; 
            justify-content: space-between; padding: 0 30px; box-sizing: border-box; 
            pointer-events: none; z-index: 20;
        }
        .btn-control {
            width: 90px; height: 90px; background: rgba(255,255,255,0.15); 
            border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); 
            pointer-events: auto; display: flex; justify-content: center; 
            align-items: center; font-size: 40px; color: white; user-select: none;
        }
        .btn-control:active { background: rgba(255,255,255,0.4); }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1>Turbo Bianca</h1>
        <p>Distância Segura: 3 Etapas</p>
        <button onclick="iniciarJogo()">START</button>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            SCORE: <span id="score">0</span> <br>
            <span id="nivel-info" style="font-size: 14px; color: #f1c40f;">Nível 1</span>
        </div>
        <div class="mobile-controls" id="mobileControls" style="display:none;">
            <div class="btn-control" id="btnLeft">◀</div>
            <div class="btn-control" id="btnRight">▶</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const socket = io();

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- GEOMETRIA DA PISTA ---
        const LARGURA_PISTA_TOPO = 100; // Horizonte mais fechado para acentuar perspectiva
        const LARGURA_PISTA_BASE = window.innerWidth > 800 ? 800 : window.innerWidth; 

        // --- CONFIGURAÇÕES DO JOGO ---
        let jogoRodando = false;
        let frameId;
        let pontuacao = 0;
        
        let tempoDecorrido = 0;
        let ultimoTempoNivel = 0;
        // Tempo TOTAL para percorrer as 6 etapas (Início ao fim)
        // Se cada etapa é 0.5s, total = 3.0s
        let tempoTotalPista = 3.0; 
        
        let offsetPista = 0;
        
        const ESCALA_JOGADOR = 1.5; 
        const ESCALA_HORIZONTE = 0.05; // Obstáculo nasce bem pequeno

        let jogador = { faixa: 1, x: 0, y: 0, cor: '#e84118', w: 60, h: 50 };
        // Obstáculos agora armazenam 'progresso' (0.0 a 1.0) em vez de Y pixels
        let obstaculos = [];

        function desenharSpriteCarro(ctx, x, y, scale, corPrincipal) {
            const w = 60 * scale; 
            const h = 50 * scale; 
            ctx.fillStyle = '#111';
            ctx.fillRect(x - w*0.1, y + h*0.6, w*0.2, h*0.4);
            ctx.fillRect(x + w*0.9, y + h*0.6, w*0.2, h*0.4);
            ctx.fillStyle = corPrincipal;
            ctx.fillRect(x, y + h*0.4, w, h*0.6); 
            ctx.fillRect(x + w*0.15, y, w*0.7, h*0.4);
            ctx.fillStyle = '#87ceeb';
            ctx.fillRect(x + w*0.2, y + h*0.05, w*0.6, h*0.3);
            ctx.fillStyle = '#c0392b';
            ctx.fillRect(x + w*0.05, y + h*0.5, w*0.2, h*0.15); 
            ctx.fillRect(x + w*0.75, y + h*0.5, w*0.2, h*0.15); 
        }

        function desenharCenario(velocidadeProgresso) {
            const h = canvas.height / 2;
            
            ctx.fillStyle = '#192a56'; ctx.fillRect(0, 0, canvas.width, h);
            ctx.fillStyle = '#273c75'; ctx.fillRect(0, h, canvas.width, h);

            // Estrada
            ctx.fillStyle = '#7f8fa6'; 
            ctx.beginPath();
            const centro = canvas.width / 2;
            ctx.moveTo(centro - LARGURA_PISTA_TOPO/2, h); 
            ctx.lineTo(centro + LARGURA_PISTA_TOPO/2, h); 
            ctx.lineTo(centro + LARGURA_PISTA_BASE/2, canvas.height); 
            ctx.lineTo(centro - LARGURA_PISTA_BASE/2, canvas.height); 
            ctx.fill();

            // Faixas Animadas
            // O offset agora depende da velocidade visual percebida
            offsetPista += velocidadeProgresso * 3000; 
            if (offsetPista > 100) offsetPista = 0;

            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 4;
            ctx.setLineDash([50, 50]); 
            ctx.lineDashOffset = -offsetPista;

            ctx.beginPath();
            // Calcula as linhas internas usando geometria de perspectiva
            // Desenhamos apenas uma linha reta, mas a animação dá a ilusão
            // Para ser perfeito, as linhas deveriam convergir, mas para este estilo arcade, linhas retas funcionam
            // Ajuste visual: Linhas convergentes
            ctx.moveTo(centro - LARGURA_PISTA_TOPO/6, h); 
            ctx.lineTo(centro - LARGURA_PISTA_BASE/6, canvas.height);
            
            ctx.moveTo(centro + LARGURA_PISTA_TOPO/6, h); 
            ctx.lineTo(centro + LARGURA_PISTA_BASE/6, canvas.height);
            
            ctx.stroke();
            ctx.setLineDash([]); 
        }

        // Função de Projeção: Converte Progresso (0-1) em Pixel Y na tela
        // Aplica uma curva quadrática para simular a aceleração visual da perspectiva
        function getYPorProgresso(p) {
            const h = canvas.height / 2; // Horizonte
            const pistaH = canvas.height / 2; // Altura da pista
            
            // Fórmula: Y = Horizonte + (AlturaPista * Progresso^2)
            // Usar p*p faz com que ele mova poucos pixels no começo (longe)
            // e muitos pixels no final (perto), corrigindo a ilusão visual.
            return h + (pistaH * (p * p)); 
        }

        // Inverso: Dado um Y, qual a largura da pista ali?
        function getLarguraPistaNoY(y) {
            const h = canvas.height / 2;
            const progressoLinear = (y - h) / h; // 0 a 1 linearmente na tela
            return LARGURA_PISTA_TOPO + (LARGURA_PISTA_BASE - LARGURA_PISTA_TOPO) * progressoLinear;
        }

        function getXNaPista(faixa, y) {
            const larguraAtual = getLarguraPistaNoY(y);
            const centro = canvas.width / 2;
            const indiceFaixa = faixa - 1; 
            const larguraFaixa = larguraAtual / 3;
            return centro + (indiceFaixa * larguraFaixa);
        }

        function desenharJogador() {
            // Jogador sempre está em Progresso = 1.0 (Final da pista)
            // Mas visualmente colocamos ele um pouco antes do fim absoluto da tela
            jogador.y = canvas.height - 120; 
            jogador.x = getXNaPista(jogador.faixa, jogador.y) - (60 * ESCALA_JOGADOR / 2);
            desenharSpriteCarro(ctx, jogador.x, jogador.y, ESCALA_JOGADOR, jogador.cor);
        }

        function atualizarNivel() {
            tempoDecorrido += 1/60;
            if (tempoDecorrido - ultimoTempoNivel >= 20) {
                ultimoTempoNivel = tempoDecorrido;
                // Reduz o tempo total (aumenta velocidade)
                // Se tempoTotalPista for < 1.0s, fica insano
                if (tempoTotalPista > 1.0) {
                    tempoTotalPista -= 0.5; // Reduz 0.5s do tempo total a cada nível
                    const tempoEtapa = tempoTotalPista / 6;
                    document.getElementById('nivel-info').innerText = "TURBO!";
                    setTimeout(() => {
                         document.getElementById('nivel-info').innerText = `Etapa: ${tempoEtapa.toFixed(2)}s`;
                    }, 2000);
                }
            }
        }

        function gerenciarObstaculos() {
            // Quanto de progresso o carro anda por frame?
            // 1.0 (Total) / (TempoTotal * 60 FPS)
            const progressoPorFrame = 1.0 / (tempoTotalPista * 60);

            // --- REGRA DE OURO: 3 ETAPAS DE DISTÂNCIA ---
            // A pista tem 6 etapas. 3 etapas = 50% da pista (0.5 de progresso).
            // O próximo carro só nasce se o último tiver progresso > 0.5
            
            let podeSpawnar = false;
            
            if (obstaculos.length === 0) {
                podeSpawnar = true;
            } else {
                const ultimo = obstaculos[obstaculos.length - 1];
                // Verifica se já passou da metade do caminho (3 etapas)
                // Usamos 0.5 (50%). 
                // Se quiser ser EXATO 3 etapas, é 0.5.
                if (ultimo.progresso > 0.5) {
                    podeSpawnar = true;
                }
            }

            if (podeSpawnar) {
                const cores = ['#4cd137', '#0097e6', '#8c7ae6', '#fbc531'];
                obstaculos.push({
                    faixa: Math.floor(Math.random() * 3),
                    progresso: 0, // Começa no horizonte (0%)
                    cor: cores[Math.floor(Math.random() * cores.length)]
                });
            }

            for (let i = obstaculos.length - 1; i >= 0; i--) {
                let obs = obstaculos[i];
                
                // Atualiza progresso lógico (linear no tempo)
                obs.progresso += progressoPorFrame;

                // Converte progresso lógico em Posição Visual Y (Curva Quadrática)
                // Isso faz ele parecer lento longe e rápido perto
                obs.y = getYPorProgresso(obs.progresso);

                // Escala visual
                let scale = ESCALA_HORIZONTE + (ESCALA_JOGADOR - ESCALA_HORIZONTE) * obs.progresso;
                
                const x = getXNaPista(obs.faixa, obs.y) - (60 * scale / 2);

                // Desenha se estiver na tela
                if (obs.progresso < 1.2) {
                    desenharSpriteCarro(ctx, x, obs.y, scale, obs.cor);
                }

                // Colisão (Zona de perigo no final da pista)
                // Como o jogador está visualmente em Y ~90% da tela,
                // a colisão ocorre quando progresso é ~0.9
                // Ajuste fino: Entre 0.85 e 0.95 do progresso total
                if (obs.progresso > 0.85 && obs.progresso < 0.95) {
                    if (obs.faixa === jogador.faixa) {
                        gameOver();
                    }
                }
                
                if (obs.progresso > 1.2) obstaculos.splice(i, 1);
            }
            
            return progressoPorFrame; // Retorna para animar a pista
        }

        function loop() {
            if (!jogoRodando) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            atualizarNivel();
            // Precisamos calcular o progresso para animar o chao na mesma velocidade
            const velocidadeAtual = 1.0 / (tempoTotalPista * 60);
            
            desenharCenario(velocidadeAtual);
            
            pontuacao++;
            document.getElementById('score').innerText = Math.floor(pontuacao/10);
            
            gerenciarObstaculos();
            desenharJogador();
            frameId = requestAnimationFrame(loop);
        }

        function iniciarJogo() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('mobileControls').style.display = 'flex';
            jogoRodando = true;
            tempoDecorrido = 0;
            ultimoTempoNivel = 0;
            
            // RESET: 6 etapas de 0.5s = 3.0s total
            tempoTotalPista = 3.0; 
            
            pontuacao = 0;
            obstaculos = [];
            loop();
        }

        function gameOver() {
            jogoRodando = false;
            cancelAnimationFrame(frameId);
            alert(`BATIDA!`);
            location.reload();
        }

        function mover(direcao) {
            if (!jogoRodando) return;
            let novaFaixa = jogador.faixa + direcao;
            if (novaFaixa >= 0 && novaFaixa <= 2) jogador.faixa = novaFaixa;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') mover(-1);
            if (e.key === 'ArrowRight' || e.key === 'd') mover(1);
        });
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); mover(-1); });
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); mover(1); });
    </script>
</body>
</html>
