<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOP GEAR - SNES REPLICA</title>
    <style>
        /* CSS para Upscaling sem borrão (Pixel Perfect) */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #050510; overflow: hidden; touch-action: none;
        }
        
        #game-container {
            width: 100vw; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        canvas { 
            /* Renderiza na resolução nativa do SNES (256x224) e estica via CSS */
            width: 100%;
            height: 100%;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            object-fit: contain; /* Mantém a proporção correta da tela */
            display: block;
            background: #000;
        }
        
        /* UI Retro */
        #ui-layer { 
            position: absolute; top: 10px; left: 10px; 
            font-family: 'Courier New', monospace; 
            color: #fff; text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            z-index: 10;
        }
        #score { font-size: 24px; color: #f1c40f; font-weight: bold;}
        #nivel-info { font-size: 14px; color: #ccc; display: block; margin-top: 5px;}
        
        /* Tela de Start */
        #start-screen { 
            position: absolute; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); 
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            color: white; z-index: 20; 
        }
        h1 { 
            font-family: 'Courier New', monospace; 
            font-size: 40px; color: #fff; 
            text-shadow: 4px 4px 0 #c23616; 
            margin-bottom: 20px; text-align: center;
            line-height: 1.2;
        }
        
        /* Controles Mobile */
        .mobile-controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; box-sizing: border-box; pointer-events: none; z-index: 15; }
        .btn-control { width: 80px; height: 80px; background: rgba(255,255,255,0.15); border: 2px solid #fff; border-radius: 50%; pointer-events: auto; }
        .btn-control:active { background: rgba(255,255,255,0.4); }
        
        button { 
            font-family: 'Courier New', monospace; padding: 15px 30px; 
            font-size: 20px; font-weight: bold; background: #c23616; 
            color: #fff; border: 4px solid #fff; cursor: pointer; 
            text-transform: uppercase;
        }
        button:hover { background: #e84118; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="256" height="224"></canvas>
        
        <div id="ui-layer">
            SCORE <span id="score">000000</span><br>
            <span id="nivel-info">STAGE 1 - PRESS START</span>
        </div>
        
        <div class="mobile-controls" id="mobileControls" style="display:none;">
            <div class="btn-control" id="btnLeft"></div>
            <div class="btn-control" id="btnRight"></div>
        </div>
        
        <div id="start-screen">
            <h1>TOP RACER<br>REPLICA</h1>
            <button onclick="iniciarJogo()">START ENGINE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        // --- CONSTANTES DE RESOLUÇÃO SNES ---
        const WIDTH = 256;
        const HEIGHT = 224;
        const CENTRO_X = WIDTH / 2;
        const HORIZONTE_Y = HEIGHT * 0.45; // Horizonte levemente mais alto para ver mais pista

        // Geometria da Pista
        const LARGURA_PISTA_TOPO = 4; 
        const LARGURA_PISTA_BASE = 240; 

        // --- ESTADO DO JOGO ---
        let jogoRodando = false;
        let frameId;
        let pontuacao = 0;
        let tempoDecorrido = 0;
        let ultimoTempoNivel = 0;
        let tempoTotalPista = 2.0; 
        let offsetPista = 0;
        
        let jogador = { 
            faixa: 1, x: 0, y: 0, 
            tiltAtual: 0, tiltAlvo: 0, 
            frameAnimacao: 0 
        };
        let obstaculos = [];
        let particulasFumaca = [];

        // --- MATRIZ DO CARRO TOP GEAR (100% FIEL / BOXY SHAPE) ---
        const SPRITE_CARRO_FINAL = [
            "......................................................",
            ".........QQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQ.........", // Teto Plano e Largo
            "........QQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQ........",
            ".......QQBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBQQ.......", // Vidro Retangular
            ".......QQBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBQQ.......",
            "......QQQBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBQQQ......",
            "......QQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQ......",
            ".....DQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQD.....", // Ombros Largos
            ".....DQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQD.....",
            ".....DQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQD.....",
            "....DDQQKRRRRRRRRKKWWWWWWWWWWWWWWWWKKRRRRRRRRKQQDD....", // Lanternas e Placa alinhadas
            "....DDQQKRRRRRRRRKKWWWWWWWWWWWWWWWWKKRRRRRRRRKQQDD....",
            "....DDQQKRRRRRRRRKKWWWWWWWWWWWWWWWWKKRRRRRRRRKQQDD....",
            "....DDQQGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGQQDD....",
            "....DDQQGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGQQDD....",
            "....DDQQGGEEEEEGGGGGGGGGGGGGGGGGGGGGGGGEEEEEGGQQDD....", // Escapamento Quadruplo
            ".....TTTQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQTTTT.....",
            ".....TTTTT..................................TTTTT.....", // Pneus na base extrema
            "......TTTT..................................TTTT......"
        ];

        // Paleta de Cores Fiel ao Top Gear (Tons frios e dessaturados)
        const PALETA_CORES = {
            ".": "transparent",
            "D": "#2B2B35", // Sombra/Contorno
            "Q": "#6D7A8F", // Cinza Azulado (Carroceria)
            "B": "#111111", // Vidro Preto
            "W": "#E0E0E0", // Placa Branca
            "R": "#CC0000", // Vermelho Sangue
            "K": "#333333", // Moldura da Luz
            "G": "#1A1A1A", // Para-choque
            "E": "#000000", // Escapamento
            "T": "#000000"  // Pneus
        };

        // Cria variação de cor para os carros inimigos
        function getPaletaObstaculo(corHex) {
            let p = {...PALETA_CORES}; 
            p['Q'] = corHex; 
            return p;
        }

        // --- RENDERIZAÇÃO PIXEL PERFECT ---
        function desenharSpritePixel(ctx, x, y, scale, matrix, palette) {
            // Centraliza o sprite baseado em sua largura
            let startX = Math.floor(x - (matrix[0].length * scale) / 2);
            let startY = Math.floor(y - (matrix.length * scale));

            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[0].length; c++) {
                    let char = matrix[r][c];
                    if (char !== '.' && palette[char]) {
                        ctx.fillStyle = palette[char];
                        // Garante que o pixel seja desenhado como um bloco sólido
                        let s = Math.ceil(scale); 
                        ctx.fillRect(startX + (c * s), startY + (r * s), s, s);
                    }
                }
            }
        }

        // --- MATEMÁTICA DA ESTRADA ---
        function getYPorProgresso(p) {
            // Curva exponencial para simular profundidade (Z-Axis)
            let alturaPista = HEIGHT - HORIZONTE_Y;
            return HORIZONTE_Y + (alturaPista * Math.pow(p, 3)); 
        }

        function getLarguraPistaNoY(y) {
            if (y < HORIZONTE_Y) return LARGURA_PISTA_TOPO;
            let progressoLinear = (y - HORIZONTE_Y) / (HEIGHT - HORIZONTE_Y);
            return LARGURA_PISTA_TOPO + (LARGURA_PISTA_BASE - LARGURA_PISTA_TOPO) * progressoLinear;
        }

        function getXNaPista(faixa, y) {
            let largura = getLarguraPistaNoY(y);
            // Faixas: -1, 0, 1
            return CENTRO_X + ((faixa - 1) * (largura * 0.35)); 
        }

        // --- DRAW LOOP ---
        function desenharFundo() {
            // Céu Gradiente Noturno
            let grd = ctx.createLinearGradient(0, 0, 0, HORIZONTE_Y);
            grd.addColorStop(0, "#000000"); 
            grd.addColorStop(0.5, "#090914");
            grd.addColorStop(1, "#1c1c3c");
            ctx.fillStyle = grd; 
            ctx.fillRect(0, 0, WIDTH, HORIZONTE_Y);
            
            // Estrelas simples (pixel noise)
            ctx.fillStyle = "#FFF";
            if(Math.random() > 0.5) ctx.fillRect(Math.random()*WIDTH, Math.random()*HORIZONTE_Y, 1, 1);
            
            // Chão
            ctx.fillStyle = '#0f1f0f'; 
            ctx.fillRect(0, HORIZONTE_Y, WIDTH, HEIGHT - HORIZONTE_Y);
        }

        function desenharEstrada(vel) {
            // Asfalto
            ctx.fillStyle = '#3a3a3a';
            ctx.beginPath();
            ctx.moveTo(CENTRO_X - LARGURA_PISTA_TOPO/2, HORIZONTE_Y);
            ctx.lineTo(CENTRO_X + LARGURA_PISTA_TOPO/2, HORIZONTE_Y);
            ctx.lineTo(CENTRO_X + LARGURA_PISTA_BASE/2, HEIGHT);
            ctx.lineTo(CENTRO_X - LARGURA_PISTA_BASE/2, HEIGHT);
            ctx.fill();

            // Zebras Animadas
            offsetPista += vel * 90; 
            if (offsetPista > 20) offsetPista = 0;

            let passos = 24; 
            for(let i=0; i<passos; i++) {
                let progresso = (i / passos) + (offsetPista / 1000); 
                progresso = progresso % 1;
                
                let y = getYPorProgresso(progresso);
                if(y > HEIGHT) continue;

                let largura = getLarguraPistaNoY(y);
                let zebraW = largura * 0.12; 

                // Cor da Zebra (Vermelho e Branco clássico)
                ctx.fillStyle = (i % 2 === 0) ? '#d63031' : '#ffffff';
                
                // Altura da faixa (perspectiva)
                let alturaFaixa = 2 + (progresso * 6);

                ctx.fillRect(CENTRO_X - largura/2 - zebraW, y, zebraW, alturaFaixa); // Esq
                ctx.fillRect(CENTRO_X + largura/2, y, zebraW, alturaFaixa); // Dir
            }
        }

        function desenharJogador() {
            // Posição Y fixa na parte inferior da tela
            // Ajustado para -25 pixels para mostrar os pneus inteiros
            jogador.y = HEIGHT - 25; 
            
            let xAlvo = getXNaPista(jogador.faixa, jogador.y);
            // Suavização do movimento (Lerp)
            jogador.x += (xAlvo - jogador.x) * 0.15;
            
            jogador.tiltAtual += (jogador.tiltAlvo - jogador.tiltAtual) * 0.15;
            
            // Gerador de Fumaça
            jogador.frameAnimacao++;
            if(frameId % 5 === 0) gerarFumaca(jogador.x, jogador.y);

            ctx.save();
            ctx.translate(Math.floor(jogador.x), Math.floor(jogador.y));
            ctx.rotate((jogador.tiltAtual * Math.PI) / 180);

            // DESENHA O CARRO
            desenharSpritePixel(ctx, 0, 0, 1, SPRITE_CARRO_FINAL, PALETA_CORES);
            
            ctx.restore();
        }

        function gerarFumaca(x, y) {
            particulasFumaca.push({ x: x-18, y: y, vx: -0.5, vy: 1, life: 12 }); // Pneu Esq
            particulasFumaca.push({ x: x+18, y: y, vx: 0.5, vy: 1, life: 12 });  // Pneu Dir
        }
        
        function desenharFumaca() {
            ctx.fillStyle = '#7f8c8d';
            for(let i=particulasFumaca.length-1; i>=0; i--) {
                let p = particulasFumaca[i];
                p.x += p.vx; p.y -= p.vy; p.life--;
                
                if(p.life <= 0) { particulasFumaca.splice(i,1); continue; }
                
                let s = p.life < 6 ? 2 : 1;
                ctx.fillRect(Math.floor(p.x), Math.floor(p.y), s, s);
            }
        }

        function gerenciarObstaculos(vel) {
            // Lógica de Spawn Inimigos
            if (obstaculos.length === 0 || obstaculos[obstaculos.length-1].progresso > 0.3) {
                if(Math.random() < 0.02) {
                    let cores = ['#ff9ff3', '#feca57', '#54a0ff', '#5f27cd'];
                    obstaculos.push({ 
                        faixa: Math.floor(Math.random()*3), 
                        progresso: 0, 
                        cor: cores[Math.floor(Math.random()*cores.length)]
                    });
                }
            }

            for(let i=obstaculos.length-1; i>=0; i--) {
                let obs = obstaculos[i];
                obs.progresso += vel * 0.6; // Inimigos são mais lentos que o cenário
                
                let y = getYPorProgresso(obs.progresso);
                let x = getXNaPista(obs.faixa, y);
                
                // Scale Simples (0.1 no horizonte até 1.0 perto da tela)
                let scale = Math.max(0.1, Math.pow(obs.progresso, 3));
                
                if (obs.progresso < 1.05) {
                    let paleta = getPaletaObstaculo(obs.cor);
                    desenharSpritePixel(ctx, x, y, scale, SPRITE_CARRO_FINAL, paleta);
                }

                // Colisão
                if (obs.progresso > 0.92 && obs.progresso < 0.98) {
                    // hitbox simples baseada na largura da faixa
                    if (Math.abs(x - jogador.x) < 30) gameOver(); 
                }
                
                if (obs.progresso > 1.2) obstaculos.splice(i,1);
            }
        }

        // --- LOOP PRINCIPAL ---
        function loop() {
            if(!jogoRodando) return;
            
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            
            tempoDecorrido += 1/60;
            // Dificuldade progressiva
            if(tempoDecorrido - ultimoTempoNivel > 15) {
                ultimoTempoNivel = tempoDecorrido;
                if(tempoTotalPista > 0.8) tempoTotalPista -= 0.15;
                document.getElementById('nivel-info').innerText = "SPEED UP! LEVEL " + Math.floor(tempoDecorrido/15);
            }

            let velocidade = 1 / (tempoTotalPista * 60);

            desenharFundo();
            desenharEstrada(velocidade);
            desenharFumaca();
            
            gerenciarObstaculos(velocidade);
            desenharJogador();
            
            pontuacao += 1;
            document.getElementById('score').innerText = pontuacao.toString().padStart(6,'0');

            frameId = requestAnimationFrame(loop);
        }

        // --- CONTROLES ---
        function iniciarJogo() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('mobileControls').style.display = 'flex';
            jogoRodando = true; pontuacao = 0; obstaculos = []; particulasFumaca = [];
            tempoDecorrido = 0; tempoTotalPista = 2.0;
            loop();
        }

        function gameOver() {
            jogoRodando = false; cancelAnimationFrame(frameId);
            setTimeout(() => { 
                alert("CRASH! Score: " + pontuacao); 
                location.reload(); 
            }, 100);
        }

        function mover(dir) {
            if(!jogoRodando) return;
            let n = jogador.faixa + dir;
            if(n >= 0 && n <= 2) {
                jogador.faixa = n;
                jogador.tiltAlvo = dir * 8; // Inclina o carro ao virar
            }
        }
        function endireitar() { jogador.tiltAlvo = 0; }

        window.addEventListener('keydown', e => {
            if(e.key==='ArrowLeft'||e.key==='a') mover(-1);
            if(e.key==='ArrowRight'||e.key==='d') mover(1);
        });
        window.addEventListener('keyup', endireitar);
        
        const bL = document.getElementById('btnLeft');
        const bR = document.getElementById('btnRight');
        bL.addEventListener('touchstart', e => { e.preventDefault(); mover(-1); });
        bR.addEventListener('touchstart', e => { e.preventDefault(); mover(1); });
        bL.addEventListener('touchend', endireitar);
        bR.addEventListener('touchend', endireitar);
        
        // Suporte a Mouse Click para testes no PC
        bL.addEventListener('mousedown', e => { mover(-1); });
        bR.addEventListener('mousedown', e => { mover(1); });
        bL.addEventListener('mouseup', endireitar);
        bR.addEventListener('mouseup', endireitar);

    </script>
</body>
</html>
