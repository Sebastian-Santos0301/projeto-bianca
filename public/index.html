<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TURBO BIANCA - V4</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: 'Arial', sans-serif; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; background: #000; }
        canvas { display: block; max-width: 100%; max-height: 100%; }
        
        #ui-layer { position: absolute; top: 20px; left: 20px; color: white; z-index: 5; font-size: 18px; text-shadow: 2px 2px 0 #000; font-weight: bold;}
        
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white; z-index: 10;
        }
        h1 { margin: 0 0 10px 0; font-size: 40px; font-style: italic; color: #ffeb3b; text-transform: uppercase; }
        button { 
            padding: 20px 60px; font-size: 24px; font-weight: bold; text-transform: uppercase;
            background: #e84118; color: white; border: none; border-radius: 5px; 
            margin-top: 30px; cursor: pointer; box-shadow: 0 5px 0 #c23616;
        }
        button:active { transform: translateY(4px); box-shadow: none; }
        
        .mobile-controls {
            position: absolute; bottom: 20px; width: 100%; display: flex; 
            justify-content: space-between; padding: 0 30px; box-sizing: border-box; 
            pointer-events: none; z-index: 20;
        }
        .btn-control {
            width: 90px; height: 90px; background: rgba(255,255,255,0.15); 
            border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); 
            pointer-events: auto; display: flex; justify-content: center; 
            align-items: center; font-size: 40px; color: white; user-select: none;
        }
        .btn-control:active { background: rgba(255,255,255,0.4); }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1>Turbo Bianca</h1>
        <p>Desvie dos obstáculos!</p>
        <button onclick="iniciarJogo()">ACELERAR</button>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            SCORE: <span id="score">0</span> <br>
            <span id="nivel-info" style="font-size: 14px; color: #f1c40f;">Nível 1</span>
        </div>
        <div class="mobile-controls" id="mobileControls" style="display:none;">
            <div class="btn-control" id="btnLeft">◀</div>
            <div class="btn-control" id="btnRight">▶</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const socket = io();

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- CONSTANTES VISUAIS (Para alinhar física e desenho) ---
        // Definimos larguras fixas para a estrada não "dançar"
        const LARGURA_PISTA_TOPO = 200; // Largura visual no horizonte
        const LARGURA_PISTA_BASE = window.innerWidth > 800 ? 800 : window.innerWidth; // Largura na base

        // --- CONFIGURAÇÕES DO JOGO ---
        let jogoRodando = false;
        let frameId;
        let pontuacao = 0;
        
        // Controle de Velocidade e Animação
        let tempoDecorrido = 0;
        let ultimoTempoNivel = 0;
        let tempoPorEtapa = 0.5;
        let offsetPista = 0; // Para animar o chão correndo
        
        // Spawn Controlado
        let ultimoSpawnY = 0; // Onde estava o último carro quando spawnou?
        
        const ESCALA_JOGADOR = 1.5; 
        const ESCALA_HORIZONTE = 0.1;

        let jogador = { faixa: 1, x: 0, y: 0, cor: '#e84118', w: 60, h: 50 };
        let obstaculos = [];

        // --- ARTE ---
        function desenharSpriteCarro(ctx, x, y, scale, corPrincipal) {
            const w = 60 * scale; 
            const h = 50 * scale; 
            // Pneus
            ctx.fillStyle = '#111';
            ctx.fillRect(x - w*0.1, y + h*0.6, w*0.2, h*0.4);
            ctx.fillRect(x + w*0.9, y + h*0.6, w*0.2, h*0.4);
            // Corpo
            ctx.fillStyle = corPrincipal;
            ctx.fillRect(x, y + h*0.4, w, h*0.6); 
            ctx.fillRect(x + w*0.15, y, w*0.7, h*0.4);
            // Vidro
            ctx.fillStyle = '#87ceeb';
            ctx.fillRect(x + w*0.2, y + h*0.05, w*0.6, h*0.3);
            // Luzes
            ctx.fillStyle = '#c0392b';
            ctx.fillRect(x + w*0.05, y + h*0.5, w*0.2, h*0.15); 
            ctx.fillRect(x + w*0.75, y + h*0.5, w*0.2, h*0.15); 
        }

        function desenharCenario(velocidadePixels) {
            const h = canvas.height / 2;

            // 1. Céu
            ctx.fillStyle = '#192a56'; 
            ctx.fillRect(0, 0, canvas.width, h);
            
            // 2. Grama
            ctx.fillStyle = '#273c75'; 
            ctx.fillRect(0, h, canvas.width, h);

            // 3. Estrada (Trapézio Perfeito)
            ctx.fillStyle = '#7f8fa6'; 
            ctx.beginPath();
            const centro = canvas.width / 2;
            
            ctx.moveTo(centro - LARGURA_PISTA_TOPO/2, h); // Topo Esq
            ctx.lineTo(centro + LARGURA_PISTA_TOPO/2, h); // Topo Dir
            ctx.lineTo(centro + LARGURA_PISTA_BASE/2, canvas.height); // Base Dir
            ctx.lineTo(centro - LARGURA_PISTA_BASE/2, canvas.height); // Base Esq
            ctx.fill();

            // 4. Faixas (Animadas)
            // Aumenta o offset baseada na velocidade. Se passar de 60px, zera.
            offsetPista += velocidadePixels * 2; 
            if (offsetPista > 80) offsetPista = 0;

            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 4;
            ctx.setLineDash([40, 40]); // Tracejado
            ctx.lineDashOffset = -offsetPista; // A mágica do movimento!

            ctx.beginPath();
            
            // Interpolação para desenhar as linhas internas
            // Faixa 1 (Entre Esq e Centro)
            ctx.moveTo(centro - LARGURA_PISTA_TOPO/6, h); 
            ctx.lineTo(centro - LARGURA_PISTA_BASE/6, canvas.height);
            
            // Faixa 2 (Entre Centro e Dir)
            ctx.moveTo(centro + LARGURA_PISTA_TOPO/6, h); 
            ctx.lineTo(centro + LARGURA_PISTA_BASE/6, canvas.height);
            
            ctx.stroke();
            ctx.setLineDash([]); // Limpa efeito
        }

        // Função auxiliar para descobrir o X exato de uma faixa em determinada altura Y
        function getXNaPista(faixa, y) {
            const h = canvas.height / 2;
            const progresso = (y - h) / h; // 0 no topo, 1 na base
            
            // Largura atual da pista nessa altura Y
            const larguraAtual = LARGURA_PISTA_TOPO + (LARGURA_PISTA_BASE - LARGURA_PISTA_TOPO) * progresso;
            
            const centro = canvas.width / 2;
            // Faixa -1 (Esq), 0 (Centro), 1 (Dir) - Ajustamos indice 0,1,2 para -1,0,1
            const indiceFaixa = faixa - 1; 
            
            // A largura de UMA faixa é 1/3 da largura total
            const larguraFaixa = larguraAtual / 3;
            
            return centro + (indiceFaixa * larguraFaixa);
        }

        function desenharJogador() {
            jogador.y = canvas.height - 130; 
            jogador.x = getXNaPista(jogador.faixa, jogador.y) - (60 * ESCALA_JOGADOR / 2); // Centraliza sprite
            desenharSpriteCarro(ctx, jogador.x, jogador.y, ESCALA_JOGADOR, jogador.cor);
        }

        function atualizarLogicaVelocidade() {
            tempoDecorrido += 1/60;
            if (tempoDecorrido - ultimoTempoNivel >= 20) {
                ultimoTempoNivel = tempoDecorrido;
                if (tempoPorEtapa > 0.1) {
                    tempoPorEtapa -= 0.1; 
                    if(tempoPorEtapa < 0.1) tempoPorEtapa = 0.1;
                    document.getElementById('nivel-info').innerText = "TURBO ATIVADO!";
                    setTimeout(() => document.getElementById('nivel-info').innerText = `Nível ${(0.5 - tempoPorEtapa)*10 + 1}`, 2000);
                }
            }
            const horizonteY = canvas.height / 2;
            const jogadorY = canvas.height - 130;
            const tamanhoEtapa = (jogadorY - horizonteY) / 6;
            return (tamanhoEtapa / tempoPorEtapa) / 60;
        }

        function gerenciarObstaculos(velocidadePixels) {
            const h = canvas.height / 2;
            
            // --- LÓGICA DE SPAWN JUSTO ---
            // Só tenta criar carro se o último já desceu um pouco (evita colados)
            let podeSpawnar = false;
            if (obstaculos.length === 0) {
                podeSpawnar = true;
            } else {
                // Pega o último carro adicionado
                const ultimoCarro = obstaculos[obstaculos.length - 1];
                // Distância segura: pelo menos 2 etapas de distância visual (aprox 150px visualmente escalado)
                if (ultimoCarro.y > h + 50) { // Se já desceu 50 pixels do horizonte
                   podeSpawnar = true;
                }
            }

            // Se pode spawnar, usa chance baseada no ritmo, MAS força apenas 1 por vez
            if (podeSpawnar && Math.random() < 0.05) { 
                const cores = ['#4cd137', '#0097e6', '#8c7ae6', '#fbc531'];
                obstaculos.push({
                    faixa: Math.floor(Math.random() * 3),
                    y: h, // Nasce EXATAMENTE no horizonte
                    cor: cores[Math.floor(Math.random() * cores.length)]
                });
            }

            // Loop de atualização
            for (let i = obstaculos.length - 1; i >= 0; i--) {
                let obs = obstaculos[i];
                obs.y += velocidadePixels;

                // Calcula escala baseada no progresso
                const progresso = (obs.y - h) / h;
                let scale = ESCALA_HORIZONTE + (ESCALA_JOGADOR - ESCALA_HORIZONTE) * progresso;
                if (scale < 0) scale = 0;

                // Acha o X correto usando a MESMA matemática da pista
                // Centraliza o carro (largura base 60 * scale)
                const x = getXNaPista(obs.faixa, obs.y) - (60 * scale / 2);

                if (obs.y > h) {
                    desenharSpriteCarro(ctx, x, obs.y, scale, obs.cor);
                }

                // Colisão precisa
                if (progresso > 0.95 && progresso < 1.05) {
                    if (obs.faixa === jogador.faixa) {
                        gameOver();
                    }
                }
                
                if (obs.y > canvas.height + 100) obstaculos.splice(i, 1);
            }
        }

        function loop() {
            if (!jogoRodando) return;
            
            // Limpa
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Calcula física
            let vel = atualizarLogicaVelocidade();
            
            // Desenha Cenario (passamos a velocidade para animar o chão)
            desenharCenario(vel);
            
            pontuacao += 1;
            document.getElementById('score').innerText = Math.floor(pontuacao/10);
            
            gerenciarObstaculos(vel);
            desenharJogador();
            frameId = requestAnimationFrame(loop);
        }

        function iniciarJogo() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('mobileControls').style.display = 'flex';
            jogoRodando = true;
            tempoDecorrido = 0;
            ultimoTempoNivel = 0;
            tempoPorEtapa = 0.5;
            pontuacao = 0;
            obstaculos = [];
            loop();
        }

        function gameOver() {
            jogoRodando = false;
            cancelAnimationFrame(frameId);
            alert(`BATIDA!`);
            location.reload();
        }

        function mover(direcao) {
            if (!jogoRodando) return;
            let novaFaixa = jogador.faixa + direcao;
            if (novaFaixa >= 0 && novaFaixa <= 2) jogador.faixa = novaFaixa;
        }

        // Controles
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') mover(-1);
            if (e.key === 'ArrowRight' || e.key === 'd') mover(1);
        });
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); mover(-1); });
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); mover(1); });
    </script>
</body>
</html>
