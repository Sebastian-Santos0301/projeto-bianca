<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TURBO BIANCA - V3</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: 'Arial', sans-serif; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; background: #000; }
        canvas { display: block; max-width: 100%; max-height: 100%; }
        
        #ui-layer { position: absolute; top: 20px; left: 20px; color: white; z-index: 5; font-size: 18px; text-shadow: 2px 2px 0 #000; font-weight: bold;}
        
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white; z-index: 10;
        }
        h1 { margin: 0 0 10px 0; font-size: 40px; font-style: italic; color: #ffeb3b; }
        button { 
            padding: 20px 60px; font-size: 24px; font-weight: bold; text-transform: uppercase;
            background: #e84118; color: white; border: none; border-radius: 5px; 
            margin-top: 30px; cursor: pointer; box-shadow: 0 5px 0 #c23616;
        }
        button:active { transform: translateY(4px); box-shadow: none; }
        
        .mobile-controls {
            position: absolute; bottom: 20px; width: 100%; display: flex; 
            justify-content: space-between; padding: 0 30px; box-sizing: border-box; 
            pointer-events: none; z-index: 20;
        }
        .btn-control {
            width: 90px; height: 90px; background: rgba(255,255,255,0.15); 
            border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); 
            pointer-events: auto; display: flex; justify-content: center; 
            align-items: center; font-size: 40px; color: white; user-select: none;
        }
        .btn-control:active { background: rgba(255,255,255,0.4); }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1>TURBO BIANCA</h1>
        <p>Estágio 1: Velocidade Normal</p>
        <button onclick="iniciarJogo()">START</button>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            SCORE: <span id="score">0</span> <br>
            <span id="nivel-info" style="font-size: 14px; color: #f1c40f;">Nível 1</span>
        </div>
        <div class="mobile-controls" id="mobileControls" style="display:none;">
            <div class="btn-control" id="btnLeft">◀</div>
            <div class="btn-control" id="btnRight">▶</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const socket = io();

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- CONFIGURAÇÕES DO JOGO ---
        let jogoRodando = false;
        let frameId;
        let pontuacao = 0;
        
        // Configurações de Tempo e Nível
        let tempoDecorrido = 0; // Segundos de jogo
        let ultimoTempoNivel = 0;
        let tempoPorEtapa = 0.5; // Começa em 0.5s
        const TEMPO_MINIMO_ETAPA = 0.1;
        const INTERVALO_MUDANCA_NIVEL = 20; // Segundos
        
        // Dimensões
        // Definimos escalas fixas para garantir que o obstáculo fique IGUAL ao jogador
        const ESCALA_JOGADOR = 1.5; 
        const ESCALA_HORIZONTE = 0.1;

        let jogador = { faixa: 1, x: 0, y: 0, cor: '#e84118', w: 60, h: 50 };
        let obstaculos = [];

        // --- ARTE ---
        function desenharSpriteCarro(ctx, x, y, scale, corPrincipal) {
            const w = 60 * scale; 
            const h = 50 * scale; 

            // Pneus
            ctx.fillStyle = '#111';
            ctx.fillRect(x - w*0.1, y + h*0.6, w*0.2, h*0.4);
            ctx.fillRect(x + w*0.9, y + h*0.6, w*0.2, h*0.4);

            // Corpo
            ctx.fillStyle = corPrincipal;
            ctx.fillRect(x, y + h*0.4, w, h*0.6); 
            ctx.fillRect(x + w*0.15, y, w*0.7, h*0.4);

            // Vidro
            ctx.fillStyle = '#87ceeb';
            ctx.fillRect(x + w*0.2, y + h*0.05, w*0.6, h*0.3);

            // Lanternas
            ctx.fillStyle = '#c0392b';
            ctx.fillRect(x + w*0.05, y + h*0.5, w*0.2, h*0.15); 
            ctx.fillRect(x + w*0.75, y + h*0.5, w*0.2, h*0.15); 
        }

        function desenharCenario() {
            ctx.fillStyle = '#192a56'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            const h = canvas.height / 2;
            ctx.fillStyle = '#273c75'; ctx.fillRect(0, h, canvas.width, h);

            ctx.fillStyle = '#7f8fa6'; 
            ctx.beginPath();
            // Horizonte bem largo
            ctx.moveTo(canvas.width/2 - 120, h); 
            ctx.lineTo(canvas.width/2 + 120, h);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();

            // Faixas
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 4;
            ctx.setLineDash([30, 30]);
            ctx.beginPath();
            ctx.moveTo(canvas.width/2 - 40, h); ctx.lineTo(canvas.width/3, canvas.height);
            ctx.moveTo(canvas.width/2 + 40, h); ctx.lineTo(canvas.width*2/3, canvas.height);
            ctx.stroke(); ctx.setLineDash([]);
        }

        function desenharJogador() {
            const centroTela = canvas.width / 2;
            const larguraBase = canvas.width; 
            let offset = (jogador.faixa - 1) * (larguraBase * 0.28);
            
            jogador.x = centroTela + offset - (jogador.w/2);
            jogador.y = canvas.height - 130; 

            desenharSpriteCarro(ctx, jogador.x, jogador.y, ESCALA_JOGADOR, jogador.cor);
        }

        function atualizarLogicaVelocidade() {
            // Conta o tempo (assumindo 60fps, cada frame é aprox 0.016s)
            tempoDecorrido += 1/60;

            // Verifica mudança de nível a cada 20s
            if (tempoDecorrido - ultimoTempoNivel >= INTERVALO_MUDANCA_NIVEL) {
                ultimoTempoNivel = tempoDecorrido;
                if (tempoPorEtapa > TEMPO_MINIMO_ETAPA) {
                    tempoPorEtapa -= 0.2;
                    // Correção para não ficar negativo ou zero
                    if (tempoPorEtapa < TEMPO_MINIMO_ETAPA) tempoPorEtapa = TEMPO_MINIMO_ETAPA;
                    
                    // Mostra na tela
                    document.getElementById('nivel-info').innerText = "VELOCIDADE AUMENTOU!";
                    setTimeout(() => document.getElementById('nivel-info').innerText = `Nível ${(0.5 - tempoPorEtapa)*10 + 1}`, 2000);
                }
            }

            // CÁLCULO FÍSICO DA VELOCIDADE
            // 1. Qual a distância do Horizonte até o Jogador?
            const horizonteY = canvas.height / 2;
            const jogadorY = canvas.height - 130;
            const comprimentoPista = jogadorY - horizonteY;

            // 2. Quanto mede UMA etapa (1/6 da pista)?
            const tamanhoEtapa = comprimentoPista / 6;

            // 3. Velocidade necessária (Pixels por Frame)
            // Velocidade = Distancia / Tempo.
            // Queremos percorrer 'tamanhoEtapa' em 'tempoPorEtapa' segundos.
            const pixelsPorSegundo = tamanhoEtapa / tempoPorEtapa;
            const pixelsPorFrame = pixelsPorSegundo / 60; // 60 FPS

            return pixelsPorFrame;
        }

        function gerenciarObstaculos(velocidadeAtual) {
            // Spawning: Ajusta frequência baseada na velocidade
            // Quanto mais rápido, spawnamos menos frequentemente para não ficar impossível,
            // mas como é "etapa", tentamos manter o ritmo.
            let chanceSpawn = 0.015;
            if (tempoPorEtapa <= 0.3) chanceSpawn = 0.025;
            if (tempoPorEtapa <= 0.1) chanceSpawn = 0.04;

            if (Math.random() < chanceSpawn) {
                const cores = ['#4cd137', '#0097e6', '#8c7ae6', '#fbc531'];
                obstaculos.push({
                    faixa: Math.floor(Math.random() * 3),
                    y: canvas.height / 2, // Nasce no horizonte
                    cor: cores[Math.floor(Math.random() * cores.length)]
                });
            }

            const horizonteY = canvas.height / 2;
            const jogadorY = canvas.height - 130;
            const comprimentoTotal = jogadorY - horizonteY;

            for (let i = obstaculos.length - 1; i >= 0; i--) {
                let obs = obstaculos[i];
                
                // Movimento calculado
                obs.y += velocidadeAtual;

                // --- CÁLCULO DE ESCALA PERFEITA ---
                // Calcula a porcentagem do progresso (0 = horizonte, 1 = linha do jogador)
                let progresso = (obs.y - horizonteY) / comprimentoTotal;
                
                // Se o progresso for < 0 (antes do horizonte?) trata como 0
                if (progresso < 0) progresso = 0;
                
                // Interpolação Linear: Tamanho = Inicio + (Diferença * Progresso)
                // Isso garante que quando progresso for 1 (no jogador), a escala será EXATAMENTE ESCALA_JOGADOR
                obs.scale = ESCALA_HORIZONTE + (ESCALA_JOGADOR - ESCALA_HORIZONTE) * progresso;

                // Desenho
                const centroTela = canvas.width / 2;
                const spread = canvas.width * 0.9 * progresso; 
                const offset = (obs.faixa - 1) * (spread / 2);
                const w = 60 * obs.scale; 
                const x = centroTela + offset - (w/2);

                if (obs.y > canvas.height/2) {
                    desenharSpriteCarro(ctx, x, obs.y, obs.scale, obs.cor);
                }

                // Colisão
                // A colisão ocorre se o progresso for próximo de 1 (onde está o jogador)
                // Zona de perigo: Progresso > 0.9 e < 1.1
                if (progresso > 0.90 && progresso < 1.1) {
                    if (obs.faixa === jogador.faixa) {
                        gameOver();
                    }
                }

                if (obs.y > canvas.height) obstaculos.splice(i, 1);
            }
        }

        function loop() {
            if (!jogoRodando) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            desenharCenario();
            
            // Calcula velocidade baseada no nível atual (etapas)
            let velocidadePixels = atualizarLogicaVelocidade();
            
            pontuacao += 1;
            document.getElementById('score').innerText = Math.floor(pontuacao/10);
            
            gerenciarObstaculos(velocidadePixels);
            desenharJogador();
            frameId = requestAnimationFrame(loop);
        }

        function iniciarJogo() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('mobileControls').style.display = 'flex';
            jogoRodando = true;
            tempoDecorrido = 0;
            ultimoTempoNivel = 0;
            tempoPorEtapa = 0.5; // Reset tempo
            pontuacao = 0;
            obstaculos = [];
            loop();
        }

        function gameOver() {
            jogoRodando = false;
            cancelAnimationFrame(frameId);
            alert(`BATIDA!\nTempo resistido: ${Math.floor(tempoDecorrido)}s\nNível alcançado: ${tempoPorEtapa.toFixed(1)}s/etapa`);
            location.reload();
        }

        // --- CONTROLES ---
        function mover(direcao) {
            if (!jogoRodando) return;
            let novaFaixa = jogador.faixa + direcao;
            if (novaFaixa >= 0 && novaFaixa <= 2) jogador.faixa = novaFaixa;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') mover(-1);
            if (e.key === 'ArrowRight' || e.key === 'd') mover(1);
        });
        
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); mover(-1); });
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); mover(1); });

    </script>
</body>
</html>
