<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TURBO BIANCA - V7</title>
    <style>
        /* Reset total para garantir tela cheia sem barras de rolagem */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #000; font-family: 'Arial', sans-serif; 
            touch-action: none; /* Impede zoom no celular */
        }

        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden;
        }

        /* O Canvas agora é forçado a cobrir tudo, ficando ATRÁS da UI */
        canvas { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            display: block; 
            z-index: 1; 
        }
        
        /* UI Sobreposta (HUD) */
        #ui-layer { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: white; 
            z-index: 10; /* Bem acima do jogo */
            background: rgba(0, 0, 0, 0.3); /* Fundo escuro transparente para leitura */
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            pointer-events: none; /* Garante que o toque passe através dele */
        }

        #score { font-size: 24px; font-weight: bold; color: #fff; }
        #nivel-info { font-size: 14px; color: #f1c40f; text-transform: uppercase; letter-spacing: 1px;}
        
        /* Tela de Início */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); 
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; 
            color: white; z-index: 20; /* Acima de tudo */
        }
        h1 { font-size: 40px; font-style: italic; color: #ffeb3b; text-transform: uppercase; margin-bottom: 10px;}
        
        button { 
            padding: 20px 60px; font-size: 20px; font-weight: bold; text-transform: uppercase;
            background: linear-gradient(to bottom, #e84118, #c23616); 
            color: white; border: none; border-radius: 50px; 
            margin-top: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(232, 65, 24, 0.4);
        }
        button:active { transform: translateY(2px); }
        
        /* Controles Mobile */
        .mobile-controls {
            position: absolute; bottom: 30px; width: 100%; 
            display: flex; justify-content: space-between; 
            padding: 0 20px; box-sizing: border-box; 
            pointer-events: none; z-index: 15;
        }
        .btn-control {
            width: 80px; height: 80px; 
            background: rgba(255,255,255,0.1); 
            backdrop-filter: blur(5px);
            border-radius: 50%; 
            border: 2px solid rgba(255,255,255,0.3); 
            pointer-events: auto; /* Esse precisa receber toque */
            display: flex; justify-content: center; align-items: center; 
            font-size: 30px; color: white; user-select: none;
        }
        .btn-control:active { background: rgba(255,255,255,0.3); transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            SCORE: <span id="score">0</span> <br>
            <span id="nivel-info">Nível 1</span>
        </div>

        <div class="mobile-controls" id="mobileControls" style="display:none;">
            <div class="btn-control" id="btnLeft">◀</div>
            <div class="btn-control" id="btnRight">▶</div>
        </div>

        <div id="start-screen">
            <h1>Turbo Bianca</h1>
            <p>Tela Cheia + HUD</p>
            <button onclick="iniciarJogo()">ACELERAR</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const socket = io();

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- GEOMETRIA DA PISTA (HORIZONTE ALTO) ---
        // Aqui definimos que o céu ocupa apenas 35% da tela. A pista ocupa 65%.
        const PCT_CEU = 0.35; 
        
        const LARGURA_PISTA_TOPO = 100; 
        const LARGURA_PISTA_BASE = window.innerWidth > 800 ? 800 : window.innerWidth; 

        // --- CONFIGURAÇÕES ---
        let jogoRodando = false;
        let frameId;
        let pontuacao = 0;
        let tempoDecorrido = 0;
        let ultimoTempoNivel = 0;
        let tempoTotalPista = 3.0; 
        let offsetPista = 0;
        
        const ESCALA_JOGADOR = 1.5; 
        const ESCALA_HORIZONTE = 0.05;

        let jogador = { faixa: 1, x: 0, y: 0, cor: '#e84118', w: 60, h: 50 };
        let obstaculos = [];
        let cenarioObjetos = []; 

        // --- FUNÇÕES DE GEOMETRIA (Adaptadas para horizonte dinâmico) ---
        function getHorizonteY() {
            return canvas.height * PCT_CEU;
        }

        function getYPorProgresso(p) {
            const h = getHorizonteY();
            const alturaPista = canvas.height - h;
            // Curva quadrática para perspectiva
            return h + (alturaPista * (p * p)); 
        }

        function getLarguraPistaNoY(y) {
            const h = getHorizonteY();
            const alturaPista = canvas.height - h;
            // Proteção contra divisão por zero se y < h
            if (y < h) return LARGURA_PISTA_TOPO;
            
            const progressoLinear = (y - h) / alturaPista;
            return LARGURA_PISTA_TOPO + (LARGURA_PISTA_BASE - LARGURA_PISTA_TOPO) * progressoLinear;
        }

        function getXNaPista(faixa, y) {
            const larguraAtual = getLarguraPistaNoY(y);
            const centro = canvas.width / 2;
            const indiceFaixa = faixa - 1; 
            const larguraFaixa = larguraAtual / 3;
            return centro + (indiceFaixa * larguraFaixa);
        }

        // --- ARTE ---
        function desenharSpriteCarro(ctx, x, y, scale, corPrincipal) {
            const w = 60 * scale; const h = 50 * scale; 
            ctx.fillStyle = '#111';
            ctx.fillRect(x - w*0.1, y + h*0.6, w*0.2, h*0.4);
            ctx.fillRect(x + w*0.9, y + h*0.6, w*0.2, h*0.4);
            ctx.fillStyle = corPrincipal;
            ctx.fillRect(x, y + h*0.4, w, h*0.6); 
            ctx.fillRect(x + w*0.15, y, w*0.7, h*0.4);
            ctx.fillStyle = '#87ceeb';
            ctx.fillRect(x + w*0.2, y + h*0.05, w*0.6, h*0.3);
            ctx.fillStyle = '#c0392b';
            ctx.fillRect(x + w*0.05, y + h*0.5, w*0.2, h*0.15); 
            ctx.fillRect(x + w*0.75, y + h*0.5, w*0.2, h*0.15); 
        }

        function desenharArvore(ctx, x, y, scale) {
            const w = 40 * scale; const h = 80 * scale;
            ctx.fillStyle = '#4b3621'; ctx.fillRect(x - w*0.2, y + h*0.8, w*0.4, h*0.2);
            ctx.fillStyle = '#0f520f'; ctx.beginPath();
            ctx.moveTo(x, y); ctx.lineTo(x + w/2, y + h*0.8); ctx.lineTo(x - w/2, y + h*0.8); ctx.fill();
        }

        function desenharPedra(ctx, x, y, scale) {
            const w = 30 * scale; const h = 20 * scale;
            ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(x, y + h/2, w/2, 0, Math.PI * 2); ctx.fill();
        }

        // --- CENÁRIO ---
        function desenharFundo() {
            const h = getHorizonteY();
            ctx.fillStyle = '#192a56'; ctx.fillRect(0, 0, canvas.width, h); // Céu
            ctx.fillStyle = '#273c75'; ctx.fillRect(0, h, canvas.width, canvas.height - h); // Grama
        }

        function desenharEstrada(velocidadeProgresso) {
            const h = getHorizonteY(); const centro = canvas.width / 2;
            ctx.fillStyle = '#7f8fa6'; 
            ctx.beginPath();
            ctx.moveTo(centro - LARGURA_PISTA_TOPO/2, h); 
            ctx.lineTo(centro + LARGURA_PISTA_TOPO/2, h); 
            ctx.lineTo(centro + LARGURA_PISTA_BASE/2, canvas.height); 
            ctx.lineTo(centro - LARGURA_PISTA_BASE/2, canvas.height); 
            ctx.fill();

            offsetPista += velocidadeProgresso * 3000; 
            if (offsetPista > 100) offsetPista = 0;
            
            ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 4;
            ctx.setLineDash([50, 50]); ctx.lineDashOffset = -offsetPista;
            ctx.beginPath();
            ctx.moveTo(centro - LARGURA_PISTA_TOPO/6, h); ctx.lineTo(centro - LARGURA_PISTA_BASE/6, canvas.height);
            ctx.moveTo(centro + LARGURA_PISTA_TOPO/6, h); ctx.lineTo(centro + LARGURA_PISTA_BASE/6, canvas.height);
            ctx.stroke(); ctx.setLineDash([]); 
        }

        // --- OBJETOS E JOGADOR ---
        function desenharJogador() {
            // Jogador fica a 120px do fundo da tela (independente do horizonte)
            jogador.y = canvas.height - 120; 
            jogador.x = getXNaPista(jogador.faixa, jogador.y) - (60 * ESCALA_JOGADOR / 2);
            desenharSpriteCarro(ctx, jogador.x, jogador.y, ESCALA_JOGADOR, jogador.cor);
        }

        function gerenciarCenarioLateral(progressoPorFrame) {
            if (Math.random() < 0.05) { 
                cenarioObjetos.push({
                    tipo: Math.random() > 0.7 ? 'pedra' : 'arvore',
                    lado: Math.random() > 0.5 ? 1 : -1,
                    progresso: 0,
                    offsetAleatorio: Math.random() * 50 
                });
            }
            const centro = canvas.width / 2;
            for (let i = cenarioObjetos.length - 1; i >= 0; i--) {
                let obj = cenarioObjetos[i];
                obj.progresso += progressoPorFrame; 
                const y = getYPorProgresso(obj.progresso);
                let scale = ESCALA_HORIZONTE + (ESCALA_JOGADOR * 1.5 - ESCALA_HORIZONTE) * obj.progresso;
                if (scale < 0) scale = 0;
                
                const larguraPistaAqui = getLarguraPistaNoY(y);
                const distanciaDoCentro = (larguraPistaAqui / 2) + (40 * scale) + obj.offsetAleatorio;
                const x = centro + (distanciaDoCentro * obj.lado);

                if (obj.tipo === 'arvore') desenharArvore(ctx, x, y, scale * 2);
                else desenharPedra(ctx, x, y, scale * 1.5);

                if (obj.progresso > 1.1) cenarioObjetos.splice(i, 1);
            }
        }

        function gerenciarObstaculos(progressoPorFrame) {
            let podeSpawnar = false;
            if (obstaculos.length === 0) podeSpawnar = true;
            else if (obstaculos[obstaculos.length - 1].progresso > 0.5) podeSpawnar = true;

            if (podeSpawnar) {
                const cores = ['#4cd137', '#0097e6', '#8c7ae6', '#fbc531'];
                obstaculos.push({
                    faixa: Math.floor(Math.random() * 3), progresso: 0, cor: cores[Math.floor(Math.random() * cores.length)]
                });
            }

            for (let i = obstaculos.length - 1; i >= 0; i--) {
                let obs = obstaculos[i];
                obs.progresso += progressoPorFrame;
                obs.y = getYPorProgresso(obs.progresso);
                let scale = ESCALA_HORIZONTE + (ESCALA_JOGADOR - ESCALA_HORIZONTE) * obs.progresso;
                
                const x = getXNaPista(obs.faixa, obs.y) - (60 * scale / 2);

                if (obs.progresso < 1.2) desenharSpriteCarro(ctx, x, obs.y, scale, obs.cor);

                if (obs.progresso > 0.85 && obs.progresso < 0.95) {
                    if (obs.faixa === jogador.faixa) gameOver();
                }
                if (obs.progresso > 1.2) obstaculos.splice(i, 1);
            }
        }

        function atualizarNivel() {
            tempoDecorrido += 1/60;
            if (tempoDecorrido - ultimoTempoNivel >= 20) {
                ultimoTempoNivel = tempoDecorrido;
                if (tempoTotalPista > 1.0) {
                    tempoTotalPista -= 0.5;
                    const tempoEtapa = tempoTotalPista / 6;
                    document.getElementById('nivel-info').innerText = "TURBO!";
                    setTimeout(() => { document.getElementById('nivel-info').innerText = `Etapa: ${tempoEtapa.toFixed(2)}s`; }, 2000);
                }
            }
        }

        function loop() {
            if (!jogoRodando) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            atualizarNivel();
            const velocidadeAtual = 1.0 / (tempoTotalPista * 60);
            
            desenharFundo();
            gerenciarCenarioLateral(velocidadeAtual);
            desenharEstrada(velocidadeAtual);
            
            pontuacao++;
            document.getElementById('score').innerText = Math.floor(pontuacao/10);
            
            gerenciarObstaculos(velocidadeAtual);
            desenharJogador();
            frameId = requestAnimationFrame(loop);
        }

        function iniciarJogo() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('mobileControls').style.display = 'flex';
            jogoRodando = true;
            tempoDecorrido = 0; ultimoTempoNivel = 0; tempoTotalPista = 3.0; 
            pontuacao = 0; obstaculos = []; cenarioObjetos = [];
            
            // Força tela cheia no Android
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch((e)=>{console.log(e)});
            }
            
            loop();
        }

        function gameOver() {
            jogoRodando = false;
            cancelAnimationFrame(frameId);
            alert(`BATIDA!`); location.reload();
        }

        function mover(direcao) {
            if (!jogoRodando) return;
            let novaFaixa = jogador.faixa + direcao;
            if (novaFaixa >= 0 && novaFaixa <= 2) jogador.faixa = novaFaixa;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') mover(-1);
            if (e.key === 'ArrowRight' || e.key === 'd') mover(1);
        });
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); mover(-1); });
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); mover(1); });
    </script>
</body>
</html>
