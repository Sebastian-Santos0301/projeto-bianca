<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JOGO BIANCA</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: 'Arial', sans-serif; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; background: #000; }
        canvas { display: block; max-width: 100%; max-height: 100%; }
        
        #ui-layer { position: absolute; top: 20px; left: 20px; color: white; z-index: 5; font-size: 18px; text-shadow: 2px 2px 0 #000; }
        
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white; z-index: 10;
        }
        button { 
            padding: 15px 40px; font-size: 22px; font-weight: bold;
            background: linear-gradient(45deg, #ff4757, #ff6b81); 
            color: white; border: none; border-radius: 50px; 
            margin-top: 20px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }
        
        .mobile-controls {
            position: absolute; bottom: 30px; width: 100%; display: flex; 
            justify-content: space-between; padding: 0 40px; box-sizing: border-box; 
            pointer-events: none; z-index: 20;
        }
        .btn-control {
            width: 80px; height: 80px; background: rgba(255,255,255,0.15); 
            border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); 
            pointer-events: auto; display: flex; justify-content: center; 
            align-items: center; font-size: 30px; color: white; user-select: none;
        }
        .btn-control:active { background: rgba(255,255,255,0.4); }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1 style="font-size: 40px; margin-bottom: 10px; text-transform: uppercase;">Bianca Racing</h1>
        <p>Toque para iniciar</p>
        <button onclick="iniciarJogo()">ACELERAR</button>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <strong>DISTÂNCIA:</strong> <span id="score">0</span>m
        </div>
        <div class="mobile-controls" id="mobileControls" style="display:none;">
            <div class="btn-control" id="btnLeft">◀</div>
            <div class="btn-control" id="btnRight">▶</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const socket = io();

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let jogoRodando = false;
        let frameId;
        let velocidade = 0;
        let distancia = 0;
        let jogador = { faixa: 1, x: 0, y: 0, cor: '#fff', w: 50, h: 80 };
        let obstaculos = [];

        function desenharCenario() {
            ctx.fillStyle = '#1e272e'; ctx.fillRect(0, 0, canvas.width, canvas.height); // Céu
            const h = canvas.height / 2;
            ctx.fillStyle = '#053f18'; ctx.fillRect(0, h, canvas.width, h); // Chão

            ctx.fillStyle = '#57606f'; // Pista
            ctx.beginPath();
            ctx.moveTo(canvas.width/2 - 10, h);
            ctx.lineTo(canvas.width/2 + 10, h);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();
        }

        function desenharJogador() {
            const centroTela = canvas.width / 2;
            const larguraBase = canvas.width; 
            let offset = (jogador.faixa - 1) * (larguraBase * 0.25);
            jogador.x = centroTela + offset - (jogador.w/2);
            jogador.y = canvas.height - 150;

            ctx.fillStyle = jogador.cor;
            ctx.fillRect(jogador.x, jogador.y, jogador.w, jogador.h);
        }

        function gerenciarObstaculos() {
            if (Math.random() < 0.02) {
                obstaculos.push({ faixa: Math.floor(Math.random() * 3), y: canvas.height / 2, scale: 0.05, cor: '#d63031' });
            }
            for (let i = obstaculos.length - 1; i >= 0; i--) {
                let obs = obstaculos[i];
                obs.y += (velocidade * 1.5) + (obs.scale * 10);
                obs.scale += 0.015;
                
                const centroTela = canvas.width / 2;
                const progressoY = (obs.y - canvas.height/2) / (canvas.height/2);
                const spread = canvas.width * 0.8 * progressoY; 
                const offset = (obs.faixa - 1) * (spread / 2);
                const w = 50 * obs.scale * 4; const h = 40 * obs.scale * 4;
                const x = centroTela + offset - (w/2);

                if (obs.y > canvas.height/2) {
                    ctx.fillStyle = obs.cor;
                    ctx.fillRect(x, obs.y, w, h);
                }

                if (obs.y > jogador.y && obs.y < jogador.y + jogador.h && obs.faixa === jogador.faixa) {
                    gameOver();
                }
                if (obs.y > canvas.height) obstaculos.splice(i, 1);
            }
        }

        function loop() {
            if (!jogoRodando) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            desenharCenario();
            velocidade += 0.005;
            distancia += Math.round(velocidade);
            document.getElementById('score').innerText = distancia;
            
            // Envia pontuação pro servidor a cada 50m
            if(distancia % 50 === 0) socket.emit('atualizarScore', distancia);

            gerenciarObstaculos();
            desenharJogador();
            frameId = requestAnimationFrame(loop);
        }

        function iniciarJogo() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('mobileControls').style.display = 'flex';
            jogoRodando = true; velocidade = 5; distancia = 0; obstaculos = [];
            loop();
        }

        function gameOver() {
            jogoRodando = false; cancelAnimationFrame(frameId);
            alert('FIM DE JOGO! Distância: ' + distancia + 'm'); location.reload();
        }

        function mover(direcao) {
            if (!jogoRodando) return;
            let novaFaixa = jogador.faixa + direcao;
            if (novaFaixa >= 0 && novaFaixa <= 2) jogador.faixa = novaFaixa;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') mover(-1);
            if (e.key === 'ArrowRight' || e.key === 'd') mover(1);
        });
        document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); mover(-1); });
        document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); mover(1); });

        socket.on('setupJogador', (dados) => { jogador.cor = dados.cor; });
    </script>
</body>
</html>
